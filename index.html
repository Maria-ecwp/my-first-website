
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      margin: 0;
      padding: 40px 16px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fff4e8;
      color: #333;
    }
    .card {
      max-width: 450px;
      margin: 30px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 4px 16px #00000015;
    }
    h1 { color: #9b4328; }
    p { line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 22px;
      background: #9b4328;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to My Website!</h1>
    <p>I am building my first website using my Samsung tablet.</p>
    <p>This is the beginning of something wonderful.</p>
    <a href="https://github.com">Explore GitHub</a>
  </div>
</body>
</html>
